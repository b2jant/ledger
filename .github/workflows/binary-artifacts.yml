name: Build binary artifacts (no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/ledger
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build from lockfile
        run: cargo +1.97.1 build --locked --release -p ledger-cli
      - name: Record build metadata
        run: |
          mkdir -p dist
          rustc +1.97.1 -vV > dist/build-info.txt
          git rev-parse HEAD >> dist/build-info.txt
      - name: Package binary and checksum
        run: python3 .github/scripts/package_binary.py
      - uses: actions/upload-artifact@v7
        with:
          name: ledger-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
